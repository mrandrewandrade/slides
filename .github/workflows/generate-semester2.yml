name: Generate Semester 2 future slides

on:
  push:
    branches:
      - future-slides
    paths:
      - scripts/generate_semester2.py
      - scripts/build_tentative.py
      - .github/workflows/generate-semester2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: slides-publish
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out future-slides
        uses: actions/checkout@v6
        with:
          ref: future-slides
          fetch-depth: 0

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Generate Semester 2 daily drafts
        run: python scripts/generate_semester2.py

      - name: Prepare student-facing tentative decks
        run: python scripts/build_tentative.py

      - name: Commit generated drafts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 2026-27/semester-2 tentative
          if git diff --cached --quiet; then
            echo "Generated drafts are already current."
          else
            git commit -m "Generate Semester 2 future slide drafts"
            git push origin future-slides
          fi

      - name: Render tentative future slides
        run: quarto render tentative

      - name: Publish tentative area to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf .gh-pages
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git clone --depth 1 --branch gh-pages "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .gh-pages
          else
            mkdir .gh-pages
            (
              cd .gh-pages
              git init
              git checkout -b gh-pages
              git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            )
          fi

          rm -rf .gh-pages/tentative
          mkdir -p .gh-pages/tentative
          cp -R _tentative-site/. .gh-pages/tentative/
          touch .gh-pages/.nojekyll

          (
            cd .gh-pages
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if git diff --cached --quiet; then
              echo "Tentative site is already current."
            else
              git commit -m "Publish tentative future slides ${GITHUB_SHA}"
              git push origin gh-pages
            fi
          )
