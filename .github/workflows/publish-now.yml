name: Publish Slides Now

# Triggered after separating completed Full slides from the new Current day.
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/publish-now.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.10.15'
      - name: Render slide site
        run: bash scripts/full-build.sh archive
      - name: Build archive indexes and staged decks
        run: |
          bash scripts/build-published-extras.sh _site
          touch _site/.nojekyll
      - name: Publish gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          keep_files: false
