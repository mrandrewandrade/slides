name: Render Quarto slides

on:
  push:
  pull_request:

permissions:
  contents: read
  statuses: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render all decks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          output="$(quarto render 2>&1)"
          code=$?
          printf '%s\n' "$output"

          if [ "$code" -eq 0 ]; then
            gh api --method POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
              -f state=success \
              -f context=quarto-render-diagnostic \
              -f description="Quarto render passed"
            exit 0
          fi

          clean="$(printf '%s\n' "$output" | sed -E 's/\x1B\[[0-9;]*[mK]//g')"
          summary="$(printf '%s\n' "$clean" | grep -Ei 'error|include|not found|does not exist|failed' | head -n 3 | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g' | cut -c1-130)"
          if [ -z "$summary" ]; then
            summary="$(printf '%s\n' "$clean" | tail -n 6 | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g' | cut -c1-130)"
          fi
          gh api --method POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=error \
            -f context=quarto-render-diagnostic \
            -f description="$summary"
          exit "$code"
