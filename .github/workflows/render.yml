name: Build and publish slides

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('slides-pr-{0}', github.event.pull_request.number) || 'slides-pages-publish' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Full validation build
        if: github.event_name == 'pull_request'
        run: |
          bash scripts/full-build.sh archive
          bash scripts/site.sh snapshot _site/archive
          bash scripts/build-published-extras.sh _site

      - name: Restore published archive
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          rm -rf .published-site
          mkdir -p .published-site
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git archive origin/gh-pages archive | tar -x -C .published-site || true
          fi

      - name: Archive previous main state
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          PREVIOUS_SHA: ${{ github.event.before }}
        run: |
          if [[ -n "$PREVIOUS_SHA" ]] && [[ "$PREVIOUS_SHA" != "0000000000000000000000000000000000000000" ]] && git cat-file -e "${PREVIOUS_SHA}:current/tej.qmd" 2>/dev/null; then
            rm -rf .previous-main
            git worktree add --detach .previous-main "$PREVIOUS_SHA"
            mkdir -p "$GITHUB_WORKSPACE/.published-site/archive"
            (
              cd .previous-main
              bash scripts/site.sh snapshot "$GITHUB_WORKSPACE/.published-site/archive"
            )
            git worktree remove --force .previous-main
          fi

      - name: Full site build
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: bash scripts/full-build.sh .published-site/archive

      - name: Preserve archive and snapshot latest day
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          if [[ -d .published-site/archive ]]; then
            mkdir -p _site/archive
            cp -R .published-site/archive/. _site/archive/
          fi
          bash scripts/site.sh snapshot _site/archive
          bash scripts/build-published-extras.sh _site
          touch _site/.nojekyll

      - name: Publish gh-pages branch
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd _site
          git init
          git checkout -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish slides ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
