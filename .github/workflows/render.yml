name: Build Slides

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.10.15'

      - name: Render slide site
        run: bash scripts/full-build.sh archive

      - name: Build archive indexes and staged decks
        run: |
          bash scripts/build-published-extras.sh _site
          touch _site/.nojekyll
