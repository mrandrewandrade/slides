project:
  type: default
  output-dir: _site
  # Keep classroom builds fast: only the student index and current decks render.
  render:
    - index.qmd
    - current/*.qmd
  resources:
    - assets/**

format:
  revealjs:
    theme: default
    css: styles.css
    slide-number: true
    progress: true
    transition: none
    navigation-mode: vertical
    controls: auto
    footer: "[Commons](https://andrewandrade.ca/commons) · [GitHub](https://github.com/mrandrewandrade/slides) · CC BY 4.0"

execute:
  freeze: auto
