project:
  type: default
  output-dir: _site
  # Keep classroom builds fast: only the student index and current decks render.
  render:
    - index.qmd
    - current/*.qmd
  resources:
    - assets/**
    - archive/**

format:
  revealjs:
    theme: default
    css: styles.css
    slide-number: true
    progress: true
    transition: none
    navigation-mode: vertical
    controls: auto
    footer: "CC BY 4.0 · Please copy, modify, and redistribute as you please.<br>Attribute [andrewandrade.ca](https://andrewandrade.ca) and [github.com/mrandrewandrade](https://github.com/mrandrewandrade) as the sources. Sharing is caring :)"

execute:
  freeze: auto
